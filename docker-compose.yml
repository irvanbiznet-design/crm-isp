version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_isp_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=crm_isp
      - DB_USERNAME=crm_isp
      - DB_PASSWORD=password
      - JWT_SECRET=crm-isp-secret-key
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - crm_isp

  db:
    image: mysql:8.0
    container_name: crm_isp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crm_isp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: crm_isp
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - crm_isp

  nginx:
    image: nginx:alpine
    container_name: crm_isp_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - crm_isp

  frontend:
    image: node:16-alpine
    container_name: crm_isp_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    command: npm run serve
    environment:
      - VUE_APP_API_URL=http://localhost:8000/api
    networks:
      - crm_isp

volumes:
  dbdata:
    driver: local

networks:
  crm_isp:
    driver: bridge
